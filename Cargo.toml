[workspace]
members = [
    "programs/*"
]
exclude = ["poc-tests", "ctf-tests", "trident-tests"]
resolver = "2"

# `cargo build-sbf` (Solana 1.18.26) ships Cargo 1.75, which cannot parse
# edition2024 manifests or lockfile v4. The committed Cargo.lock is therefore
# load-bearing: it pins blake3 to 1.5.5, keeping digest/block-buffer/crypto-common
# on their edition2021 lines. To refresh deps:
#   cargo generate-lockfile           # host cargo, resolver 3 via --config if needed
#   cargo update -p blake3 --precise 1.5.5
#   sed -i '' 's/^version = 4$/version = 3/' Cargo.lock
# Verify nothing edition2024 crept back in before committing:
#   cargo metadata --format-version 1 | jq -r '.packages[]|select(.edition=="2024")|.name'

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
