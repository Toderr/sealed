[package]
name = "escrow"
version = "0.1.0"
description = "Sealed: milestone-based escrow with USDC support"
edition = "2021"
# Matches the Cargo bundled with `cargo build-sbf` (Solana 1.18.26).
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
